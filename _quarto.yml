project:
  type: book
  output-dir: book

book:
  title: "Public Interest Data Science"
  subtitle: "Lineages, Levels, and Genres for Accountable Data Work"
  author: "Brian C. Keegan"
  date: "2026"
  description: |
    A textbook on doing data science for public-interest ends: diagnosing
    the structural pressures on public knowledge, articulating the values
    that push back, learning from the public-interest professions, and
    contributing to public conversations through the genres that make
    analysis accountable.
  license: "MIT"
  repo-url: "https://github.com/cuinfoscience/Public-Interest-Data-Science-Book"
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - part: part-1-foundations.qmd
      chapters:
        - ch-01-introduction.qmd
        - ch-02-installed-base.qmd
        - ch-03-pit-data-for-good.qmd
    - part: part-2-journalism-city.qmd
      chapters:
        - ch-04-enclosure.qmd
        - ch-05-journalism.qmd
        - ch-06-openness.qmd
        - ch-07-op-eds.qmd
    - part: part-3-law-county.qmd
      chapters:
        - ch-08-exemption.qmd
        - ch-09-law.qmd
        - ch-10-oversight.qmd
        - ch-11-testimony.qmd
    - part: part-4-assurance-state.qmd
      chapters:
        - ch-12-accounting.qmd
        - ch-13-engineering.qmd
        - ch-14-govtech-civic-tech.qmd
        - ch-15-reports.qmd
    - part: part-5-planning-nation.qmd
      chapters:
        - ch-16-erosion.qmd
        - ch-17-planning.qmd
        - ch-18-ownership.qmd
        - ch-19-critical-data-studies-refusal.qmd
        - ch-20-public-comments.qmd
    - part: part-6-beyond-portfolio.qmd
      chapters:
        - ch-21-research-proposals.qmd
        - ch-22-archival-deposits.qmd
        - ch-23-limits.qmd
  appendices:
    - appendix-ai-disclosure.qmd
    - appendix-further.qmd

bibliography: references.bib
citation: true
citations-hover: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    number-sections: true
    code-link: true
    code-fold: false
    code-overflow: wrap
    code-copy: true
    code-tools: true
    df-print: paged
    fig-responsive: true
    callout-appearance: default
    highlight-style: github

execute:
  eval: false
  echo: true
  warning: false
  cache: false
