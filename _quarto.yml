project:
  type: book
  output-dir: book

book:
  title: "Public Interest Data Science"
  subtitle: "Pressures, Values, Lineages, and Genres"
  author: "Brian C. Keegan"
  date: "2026"
  description: |
    A textbook on doing data science for public-interest ends: diagnosing
    the structural pressures on public knowledge, articulating the values
    that push back, learning from the public-interest professions, and
    contributing to public conversations through the genres that make
    analysis accountable.
  license: "MIT"
  repo-url: "https://github.com/cuinfoscience/Public-Interest-Data-Science-Book"
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - part: part-1-pressures-values.qmd
      chapters:
        - ch-01-introduction.qmd
        - ch-02-installed-base.qmd
        - ch-03-enclosure-openness.qmd
        - ch-04-exemption-oversight.qmd
        - ch-05-erosion-ownership.qmd
    - part: part-2-lineages.qmd
      chapters:
        - ch-06-journalism.qmd
        - ch-07-law.qmd
        - ch-08-accounting.qmd
        - ch-09-planning.qmd
        - ch-10-engineering.qmd
    - part: part-3-adjacent-conversations.qmd
      chapters:
        - ch-11-pit-data-for-good.qmd
        - ch-12-govtech-civic-tech.qmd
        - ch-13-critical-data-studies-refusal.qmd
    - part: part-4-genres.qmd
      chapters:
        - ch-14-op-eds.qmd
        - ch-15-reports.qmd
        - ch-16-research-proposals.qmd
        - ch-17-testimony.qmd
        - ch-18-public-comments.qmd
        - ch-19-archival-deposits.qmd
    - part: part-5-closing.qmd
      chapters:
        - ch-20-limits.qmd
  appendices:
    - appendix-ai-disclosure.qmd
    - appendix-further.qmd

bibliography: references.bib
citation: true
citations-hover: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    number-sections: true
    code-link: true
    code-fold: false
    code-overflow: wrap
    code-copy: true
    code-tools: true
    df-print: paged
    fig-responsive: true
    callout-appearance: default
    highlight-style: github

execute:
  eval: false
  echo: true
  warning: false
  cache: false
